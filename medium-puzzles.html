<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EQUARROW</title><link rel="stylesheet" href="app.css"><script src="i18n.js"></script></head><body><header class="sitebar"><div class="sitebar-inner"><a class="brand" href="index.html"><span class="brandmark">↖↘</span><span><span class="equ">EQU</span>ARROW</span></a><nav class="nav"><a href="index.html" data-i18n="nav.home">Home</a><a href="tutorial.html" data-i18n="nav.tutorial">Tutorial</a><a class="active" href="puzzles.html" data-i18n="nav.puzzles">Puzzles</a></nav></div></header><main class="page"><div class="breadcrumbs"><a href="index.html" data-i18n="nav.home">Home</a><span>›</span><a href="puzzles.html" data-i18n="nav.puzzles">Puzzles</a><span>›</span><strong data-i18n="diff.medium">Medium</strong></div><section class="hero"><div class="eyebrow" data-i18n="medium.eyebrow"></div><h1 class="display" style="font-size:clamp(42px,9vw,70px)" data-i18n="medium.title"></h1><p class="lead" data-i18n="medium.lead"></p></section><div class="section-title"><h2 data-i18n="common.choosePuzzle">Choose a puzzle</h2><p data-i18n="common.10available">10 available</p></div><section class="puzzle-grid" id="grid"></section><div class="actions"><a class="btn" href="puzzles.html" data-i18n="common.difficulties">← Difficulties</a><a class="btn" href="index.html" data-i18n="nav.home">Home</a></div></main><script>const ids=["002","003","014","015","016","017","018","019","020","021"],subs={"002":"Longer logical scan","003":"More candidate pressure","014":"Chain logic","015":"Tight scan","016":"Candidate pressure","017":"Linked deductions","018":"Sparse openings","019":"Cross-grid chain","020":"Narrow path","021":"Deep scan"};function renderGrid(){document.getElementById('grid').innerHTML=ids.map(id=>`<a class="puzzle-tile" data-puzzle="${id}" href="play.html?p=${id}"><span class="solved-badge">✓</span><div class="puzzle-num">${id}</div><div class="puzzle-meta">${EQI18N.subtitle(subs[id])}<br><span class="best" data-best></span></div></a>`).join('');document.querySelectorAll('[data-puzzle]').forEach(tile=>{const id=tile.dataset.puzzle,raw=localStorage.getItem('equarrow:'+id);if(!raw)return;try{const x=JSON.parse(raw);if(x.solved){tile.classList.add('solved');const b=tile.querySelector('[data-best]');if(x.best)b.textContent=EQI18N.t('common.best',{time:x.best});}}catch(e){}});}renderGrid();document.addEventListener('equarrow-language-change',renderGrid);</script></body></html>
