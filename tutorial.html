<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EQUARROW</title><link rel="stylesheet" href="app.css"><script src="i18n.js"></script><style>
.tutorial{width:min(820px,100%);margin:auto;padding:20px 13px 55px}.tuthead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.tuthead h1{margin:0;font-size:30px;letter-spacing:-.04em}.tuthead p{margin:4px 0 0;color:var(--muted);font-size:12px}.step-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}.prog{height:7px;border-radius:999px;background:#dedad2}.prog.done{background:#181818}.prog.current{background:var(--accent)}.lesson{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);padding:16px}.lessonTop{display:flex;justify-content:space-between;gap:10px;align-items:start}.lessonTop h2{font-size:23px;letter-spacing:-.03em;margin-bottom:5px}.lessonTop p{font-size:13px;color:var(--muted);line-height:1.5;margin:0}.badge{font-size:10px;font-weight:900;background:var(--soft);border-radius:999px;padding:6px 8px;white-space:nowrap}.coach{background:var(--accent-soft);border:1px solid #dbe5ff;border-radius:14px;padding:12px 13px;margin:14px 0;font-size:13px;line-height:1.5}.coach strong{color:#173f91}.choices{width:min(470px,100%);margin:12px auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.choice{height:55px;background:#fff;border:1px solid #d8d4cc;border-radius:12px;font-size:30px;cursor:pointer}.choice.small{font-size:16px;font-weight:850}.feedback{display:none;margin-top:11px;padding:11px 12px;border-radius:12px;font-size:13px;line-height:1.45}.feedback.show{display:block}.feedback.good{background:#e7f5ed;color:#105d35}.feedback.bad{background:#fbe9e8;color:#8e2420}.nextrow{display:flex;justify-content:flex-end;margin-top:12px}.next{display:none;border:0;border-radius:12px;background:#181818;color:#fff;padding:11px 16px;font-weight:850;cursor:pointer}.next.show{display:block}.mini2{width:min(290px,75vw);aspect-ratio:1;margin:16px auto;position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));overflow:hidden;border:3px solid #222;background:#fff}.miniCell{display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;font-size:clamp(46px,14vw,70px);line-height:1;color:var(--accent);border-right:1.5px solid #222;border-bottom:1.5px solid #222}.miniCell:nth-child(2n){border-right:0}.miniCell:nth-child(n+3){border-bottom:0}.miniCell.blank{background:#f7f9ff}.centerDot{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:#111;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #fff}.strip{width:min(510px,94vw);margin:17px auto 7px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:3px solid #222;overflow:hidden}.strip.vertical{width:min(125px,31vw);grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr))}.stripCell{aspect-ratio:1;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;background:#fff;color:var(--accent);font-size:clamp(40px,12vw,62px);line-height:1;border-right:1.5px solid #222}.stripCell:last-child{border-right:0}.vertical .stripCell{border-right:0;border-bottom:1.5px solid #222}.vertical .stripCell:last-child{border-bottom:0}.stripCell.blank{background:#f7f9ff;color:#999}.boardWrap{width:min(90vw,470px);margin:14px auto;position:relative;padding-right:43px;padding-bottom:43px}.board{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);aspect-ratio:1;overflow:hidden;border:3px solid #222;background:#fff}.cell{appearance:none;border:0;border-right:1.5px solid #222;border-bottom:1.5px solid #222;background:#fff;display:grid;place-items:center;font-size:clamp(34px,10vw,56px);line-height:1;min-width:0;min-height:0;overflow:hidden;color:var(--accent);padding:0}.cell:nth-child(4n){border-right:0}.cell:nth-child(n+13){border-bottom:0}.cell.given{background:#1d1d1d;color:#fff}.cell.target{background:#f1f5ff;outline:4px solid rgba(40,98,215,.24);outline-offset:-5px}.dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#222;transform:translate(-50%,-50%);z-index:5;box-shadow:0 0 0 2px #fff}.dot.good{background:var(--good)}.rows{position:absolute;right:0;top:0;width:39px;height:calc(100% - 43px);display:grid;grid-template-rows:repeat(4,minmax(0,1fr));align-items:center}.cols{position:absolute;left:0;bottom:0;width:calc(100% - 43px);height:39px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center}.stat{text-align:center;font-size:9px;color:var(--muted);line-height:1.2}.stat b{display:block;color:var(--ink);font-size:10px}.finish{text-align:center;padding:4px 0}.finish h2{font-size:27px;margin-bottom:6px}.finish p{font-size:13px;color:var(--muted);line-height:1.5;max-width:560px;margin:0 auto 14px}@media(max-width:520px){.lesson{padding:13px}.lessonTop{display:block}.badge{display:inline-block;margin-top:7px}}
</style></head><body><header class="sitebar"><div class="sitebar-inner"><a class="brand" href="index.html"><span class="brandmark">↖↘</span><span><span class="equ">EQU</span>ARROW</span></a><nav class="nav"><a href="index.html" data-i18n="nav.home">Home</a><a class="active" href="tutorial.html" data-i18n="nav.tutorial">Tutorial</a><a href="puzzles.html" data-i18n="nav.puzzles">Puzzles</a></nav></div></header><main class="tutorial"><div class="breadcrumbs"><a href="index.html" data-i18n="nav.home">Home</a><span>›</span><strong data-i18n="nav.tutorial">Tutorial</strong></div><div class="tuthead"><div><h1 data-i18n="tutorial.learn">Learn EQUARROW</h1><p data-i18n="tutorial.sub">Five quick puzzles from zero to solving.</p></div><div class="step-pill" id="stepPill"></div></div><div class="progress" id="progress"></div><section class="lesson" id="lesson"></section></main><script>
(()=>{const I=window.EQI18N,t=(k,v)=>I.t(k,v),SYM={NW:'↖',NE:'↗',SW:'↙',SE:'↘'},LEFT=d=>d==='NW'||d==='SW',UP=d=>d==='NW'||d==='NE';const S=[['NW','SE','NE','SW'],['SE','NW','SW','NE'],['NW','SW','NE','SE'],['SE','NE','SW','NW']];let stage=0,gradStep=0,gradGrid=null;const root=document.getElementById('lesson'),pill=document.getElementById('stepPill'),progress=document.getElementById('progress');
function pd(){progress.innerHTML='';for(let i=0;i<5;i++){const d=document.createElement('div');d.className='prog '+(i<stage?'done':i===stage?'current':'');progress.appendChild(d)}pill.textContent=t('tutorial.step',{n:stage+1})}
function fb(ok,html){const f=document.getElementById('fb');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=html;if(ok){const n=document.getElementById('next');if(n)n.classList.add('show')}}
function choices(correct,good,bad){document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.v===correct){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb(true,good)}else fb(false,bad)})}
function next(label=t('tutorial.next')){return `<div class="nextrow"><button class="next" id="next">${label}</button></div>`}
function wire(){document.getElementById('next').onclick=()=>{stage++;render()}}
function l1(){root.innerHTML=`<div class="lessonTop"><div><h2>${t('tutorial.l1.title')}</h2><p>${t('tutorial.l1.sub')}</p></div><span class="badge">${t('tutorial.sec20')}</span></div><div class="coach">${t('tutorial.l1.coach')}</div><div class="mini2"><div class="miniCell blank">?</div><div class="miniCell">↗</div><div class="miniCell">↖</div><div class="miniCell">↙</div><i class="centerDot"></i></div><div class="choices"><button class="choice" data-v="NW">↖</button><button class="choice" data-v="NE">↗</button><button class="choice" data-v="SW">↙</button><button class="choice" data-v="SE">↘</button></div><div id="fb" class="feedback"></div>${next()}`;choices('SE',t('tutorial.l1.good'),t('tutorial.l1.bad'));wire()}
function l2(){root.innerHTML=`<div class="lessonTop"><div><h2>${t('tutorial.l2.title')}</h2><p>${t('tutorial.l2.sub')}</p></div><span class="badge">${t('tutorial.sec20')}</span></div><div class="coach">${t('tutorial.l2.coach')}</div><div class="strip"><div class="stripCell">↖</div><div class="stripCell">↗</div><div class="stripCell">↙</div><div class="stripCell blank">?</div></div><div class="choices" style="grid-template-columns:repeat(2,1fr)"><button class="choice small" data-v="L">${t('tutorial.left')}</button><button class="choice small" data-v="R">${t('tutorial.right')}</button></div><div id="fb" class="feedback"></div>${next()}`;choices('R',t('tutorial.l2.good'),t('tutorial.l2.bad'));wire()}
function l3(){root.innerHTML=`<div class="lessonTop"><div><h2>${t('tutorial.l3.title')}</h2><p>${t('tutorial.l3.sub')}</p></div><span class="badge">${t('tutorial.sec20')}</span></div><div class="coach">${t('tutorial.l3.coach')}</div><div class="strip vertical"><div class="stripCell">↖</div><div class="stripCell">↘</div><div class="stripCell">↗</div><div class="stripCell blank">?</div></div><div class="choices" style="grid-template-columns:repeat(2,1fr)"><button class="choice small" data-v="U">${t('tutorial.up')}</button><button class="choice small" data-v="D">${t('tutorial.down')}</button></div><div id="fb" class="feedback"></div>${next()}`;choices('D',t('tutorial.l3.good'),t('tutorial.l3.bad'));wire()}
function boardHTML(g,target){let h='<div class="boardWrap"><div class="board">';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=g[r][c];h+=`<div class="cell ${d?'given':''} ${target&&target[0]===r&&target[1]===c?'target':''}">${d?SYM[d]:''}</div>`}for(let r=1;r<4;r++)for(let c=1;c<4;c++)h+=`<i class="dot" style="left:${c*25}%;top:${r*25}%"></i>`;return h+'</div><div id="rows" class="rows"></div><div id="cols" class="cols"></div></div>'}
function stats(g){const rs=document.getElementById('rows'),cs=document.getElementById('cols');if(!rs)return;rs.innerHTML='';cs.innerHTML='';for(let r=0;r<4;r++){const v=g[r].filter(Boolean),l=v.filter(LEFT).length;rs.innerHTML+=`<div class="stat"><b>← ${l} · ${v.length-l} →</b>${t('tutorial.need')}</div>`}for(let c=0;c<4;c++){const v=g.map(x=>x[c]).filter(Boolean),u=v.filter(UP).length;cs.innerHTML+=`<div class="stat"><b>↑ ${u} · ${v.length-u} ↓</b>${t('tutorial.need')}</div>`}}
function l4(){const g=S.map(r=>r.slice());g[0][1]='';root.innerHTML=`<div class="lessonTop"><div><h2>${t('tutorial.l4.title')}</h2><p>${t('tutorial.l4.sub')}</p></div><span class="badge">${t('tutorial.sec30')}</span></div><div class="coach">${t('tutorial.l4.coach')}</div>${boardHTML(g,[0,1])}<div class="choices"><button class="choice" data-v="NW">↖</button><button class="choice" data-v="NE">↗</button><button class="choice" data-v="SW">↙</button><button class="choice" data-v="SE">↘</button></div><div id="fb" class="feedback"></div>${next(t('tutorial.tryReal'))}`;stats(g);choices('SE',t('tutorial.l4.good'),t('tutorial.l4.bad'));wire()}
function l5(){if(!gradGrid){gradGrid=S.map(r=>r.slice());[[0,1],[2,0],[2,1],[2,2],[3,1]].forEach(([r,c])=>gradGrid[r][c]='')}const order=[[0,1,'SE'],[2,2,'NE'],[2,1,'SW'],[2,0,'NW'],[3,1,'NE']];root.innerHTML=`<div class="lessonTop"><div><h2>${t('tutorial.l5.title')}</h2><p>${t('tutorial.l5.sub')}</p></div><span class="badge">${t('tutorial.min12')}</span></div><div class="coach" id="coach"></div><div class="boardWrap"><div class="board" id="board"></div><div id="rows" class="rows"></div><div id="cols" class="cols"></div></div><div class="choices"><button class="choice" data-v="NW">↖</button><button class="choice" data-v="NE">↗</button><button class="choice" data-v="SW">↙</button><button class="choice" data-v="SE">↘</button></div><div id="fb" class="feedback"></div><div id="finish"></div>`;
const inward=(rr,cc)=>rr===0?(cc===0?'SE':'SW'):(cc===0?'NE':'NW');function di(br,bc){let n=0,f=0;for(let rr=0;rr<2;rr++)for(let cc=0;cc<2;cc++){const d=gradGrid[br+rr][bc+cc];if(d){f++;if(d===inward(rr,cc))n++}}return{n,f}}
function coach(){const c=document.getElementById('coach');if(gradStep<5)c.innerHTML=t('tutorial.c'+gradStep);else c.innerHTML=t('tutorial.doneCoach')}
function draw(){const b=document.getElementById('board');b.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=gradGrid[r][c],isGiven=S[r][c]===d&&![[0,1],[2,0],[2,1],[2,2],[3,1]].some(x=>x[0]===r&&x[1]===c),isTarget=gradStep<5&&order[gradStep][0]===r&&order[gradStep][1]===c;const x=document.createElement('div');x.className='cell '+(isGiven?'given ':'')+(isTarget?'target':'');x.textContent=d?SYM[d]:'';b.appendChild(x)}for(let c=1;c<4;c++){const d=document.createElement('i');d.style.left=`${c*25}%`;for(let r=1;r<4;r++){const d=document.createElement('i'),x=di(r-1,c-1);d.className='dot'+(x.f===4&&x.n===1?' good':'');d.style.left=`${c*25}%`;d.style.top=`${r*25}%`;b.appendChild(d)}}stats(gradGrid);coach()}
document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(gradStep>=5)return;const [r,c,want]=order[gradStep];if(btn.dataset.v!==want){fb(false,t('tutorial.wrong'));return}gradGrid[r][c]=want;gradStep++;const f=document.getElementById('fb');f.className='feedback';f.innerHTML='';draw();if(gradStep===5){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);document.getElementById('finish').innerHTML=`<div class="feedback show good">${t('tutorial.ready')}</div><div class="finish"><h2>${t('tutorial.finishTitle')}</h2><p>${t('tutorial.finishText')}</p><div class="actions" style="justify-content:center"><a class="btn primary" href="easy-puzzles.html">${t('tutorial.chooseEasy')}</a><a class="btn" href="puzzles.html">${t('tutorial.allDiff')}</a><a class="btn" href="index.html">${t('tutorial.home')}</a></div></div>`}});draw()}
function render(){pd();document.title='EQUARROW · '+t('nav.tutorial');if(stage===0)l1();else if(stage===1)l2();else if(stage===2)l3();else if(stage===3)l4();else l5()}
document.addEventListener('equarrow-language-change',render);render();
})();
</script></body></html>
