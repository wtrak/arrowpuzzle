<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARROW · Learn to Play</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#181818;--muted:#6d6961;--line:#222;--accent:#2862d7;--good:#16824b;--bad:#c53b35;--soft:#ece9e2;--teach:#eef3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,a{font:inherit}.page{width:min(820px,100%);margin:auto;padding:18px 14px 50px}header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}h1{margin:0;font-size:clamp(31px,8vw,50px);letter-spacing:-.055em;line-height:.95}.sub{margin:7px 0 0;color:var(--muted);font-size:13px}.pill{background:#fff;border:1px solid #d8d4cc;border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted)}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 14px}.prog{height:7px;background:#dedad2;border-radius:999px}.prog.done{background:#181818}.prog.current{background:var(--accent)}.card{background:#fff;border:1px solid #dedad2;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.07);padding:16px}.lessonHead{display:flex;justify-content:space-between;gap:10px;align-items:start}.lessonHead h2{margin:0;font-size:22px;letter-spacing:-.02em}.lessonHead p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.badge{flex:0 0 auto;background:var(--soft);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.coach{margin:14px 0;background:var(--teach);border:1px solid #dbe5ff;border-radius:14px;padding:12px 13px;font-size:13px;line-height:1.5}.coach strong{color:#173f91}.feedback{display:none;margin-top:12px;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.45}.feedback.show{display:block}.feedback.good{background:#e7f5ed;color:#105d35}.feedback.bad{background:#fbe9e8;color:#8e2420}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(470px,100%);margin:12px auto 0}.choice{height:58px;border:1px solid #d8d4cc;border-radius:13px;background:#fff;font-size:31px;cursor:pointer}.choice.small{font-size:25px}.choice:hover{background:#f7f6f3}.nextRow{display:flex;justify-content:flex-end;margin-top:14px}.next{display:none;border:0;border-radius:12px;background:#181818;color:#fff;font-weight:800;padding:12px 18px;cursor:pointer}.next.show{display:inline-block}.mini2{width:min(300px,75vw);aspect-ratio:1;margin:16px auto;display:grid;grid-template-columns:1fr 1fr;position:relative;border:3px solid var(--line);background:#fff}.miniCell{display:grid;place-items:center;font-size:clamp(48px,15vw,72px);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);color:var(--accent)}.miniCell:nth-child(2n){border-right:0}.miniCell:nth-child(n+3){border-bottom:0}.miniCell.blank{background:#f9fbff}.centerDot{position:absolute;left:50%;top:50%;width:15px;height:15px;border-radius:50%;background:#111;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #fff;z-index:5}.rowStrip{width:min(520px,94vw);margin:18px auto 8px;display:grid;grid-template-columns:repeat(4,1fr);border:3px solid var(--line);background:#fff}.stripCell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(42px,12vw,64px);color:var(--accent);border-right:1.5px solid var(--line)}.stripCell:last-child{border-right:0}.stripCell.blank{background:#f9fbff;color:#aaa}.columnStrip{width:min(132px,32vw);margin:18px auto 8px;display:grid;grid-template-rows:repeat(4,1fr);border:3px solid var(--line);background:#fff}.columnStrip .stripCell{border-right:0;border-bottom:1.5px solid var(--line)}.columnStrip .stripCell:last-child{border-bottom:0}.boardWrap{width:min(90vw,470px);margin:16px auto;position:relative;padding-right:44px;padding-bottom:44px}.board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);aspect-ratio:1;border:3px solid var(--line);background:#fff}.cell{border:0;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);background:#fff;display:grid;place-items:center;font-size:clamp(34px,10vw,56px);color:var(--accent);padding:0;position:relative}.cell:nth-child(4n){border-right:0}.cell:nth-child(n+13){border-bottom:0}.cell.given{background:#1d1d1d;color:#fff}.cell.target{background:#f1f5ff;outline:4px solid rgba(40,98,215,.25);outline-offset:-5px}.cell.filled{cursor:default}.dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#222;transform:translate(-50%,-50%);z-index:5;pointer-events:none;box-shadow:0 0 0 2px #fff}.dot.good{background:var(--good)}.rows{position:absolute;right:0;top:0;width:40px;height:calc(100% - 44px);display:grid;grid-template-rows:repeat(4,1fr);align-items:center}.cols{position:absolute;left:0;bottom:0;width:calc(100% - 44px);height:40px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}.stat{text-align:center;font-size:9px;color:var(--muted);line-height:1.2}.stat b{display:block;color:var(--ink);font-size:10px}.rulebox{margin-top:14px;border-top:1px solid #ece8e0;padding-top:12px;color:var(--muted);font-size:12px;line-height:1.5}.rulebox strong{color:var(--ink)}.finish{text-align:center;padding:12px 0 2px}.finish h2{font-size:27px;margin:0 0 7px}.finish p{color:var(--muted);line-height:1.5;font-size:13px;max-width:560px;margin:0 auto 15px}.playLink{display:inline-block;text-decoration:none;background:#181818;color:#fff;font-weight:800;border-radius:12px;padding:12px 16px}.ghostLink{display:inline-block;margin-left:7px;text-decoration:none;color:#444;background:#ece9e2;font-weight:750;border-radius:12px;padding:12px 16px}@media(max-width:520px){.card{padding:13px}.lessonHead{display:block}.badge{display:inline-block;margin-top:8px}.choices{gap:6px}.choice{height:52px}.ghostLink{display:block;margin:8px auto 0;width:max-content}}
</style>
</head>
<body>
<div class="page">
<header><div><h1>ARROW</h1><p class="sub">5 quick walkthroughs · from zero to solving</p></div><div class="pill" id="stepPill">1 of 5</div></header>
<div class="progress" id="progress"></div>
<section class="card" id="lesson"></section>
</div>
<script>
(()=>{
const SYM={NW:'↖',NE:'↗',SW:'↙',SE:'↘'};
const LEFT=d=>d==='NW'||d==='SW', UP=d=>d==='NW'||d==='NE';
const S=[['NW','SE','NE','SW'],['SE','NW','SW','NE'],['NW','SW','NE','SE'],['SE','NE','SW','NW']];
let stage=0;
const root=document.getElementById('lesson'),pill=document.getElementById('stepPill'),progress=document.getElementById('progress');
function updateProgress(){progress.innerHTML='';for(let i=0;i<5;i++){const d=document.createElement('div');d.className='prog '+(i<stage?'done':i===stage?'current':'');progress.appendChild(d)}pill.textContent=`${stage+1} of 5`}
function feedback(ok,msg){const f=document.getElementById('fb');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=msg;if(ok)document.getElementById('next').classList.add('show')}
function choiceButtons(items,correct,good,bad){document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.v===correct){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);feedback(true,good)}else feedback(false,bad)})}
function nextButton(label='Next puzzle'){return `<div class="nextRow"><button class="next" id="next">${label}</button></div>`}
function wireNext(){const n=document.getElementById('next');n.onclick=()=>{stage++;render()}}
function stage1(){root.innerHTML=`<div class="lessonHead"><div><h2>1. Point at the dot</h2><p>An arrow does not travel across the board. It simply points toward one corner of its own square.</p></div><span class="badge">~20 seconds</span></div>
<div class="coach"><strong>The first rule:</strong> every interior dot must have <strong>exactly one</strong> of its four surrounding arrows pointing at it. Three arrows below miss the dot. Which arrow belongs in the empty top-left square?</div>
<div class="mini2"><div class="miniCell blank">?</div><div class="miniCell">↗</div><div class="miniCell">↖</div><div class="miniCell">↙</div><i class="centerDot"></i></div>
<div class="choices"><button class="choice" data-v="NW">↖</button><button class="choice" data-v="NE">↗</button><button class="choice" data-v="SW">↙</button><button class="choice" data-v="SE">↘</button></div>
<div id="fb" class="feedback"></div>${nextButton()}`;choiceButtons(null,'SE','Correct. <strong>↘ points from the top-left square toward the center dot.</strong> Now that dot has exactly one arrow pointing at it.','Look at the corner of the empty square that touches the dot. The arrow must point toward that corner.');wireNext()}
function stage2(){root.innerHTML=`<div class="lessonHead"><div><h2>2. Balance a row</h2><p>On a 4×4 board, every row contains exactly two arrows pointing left and two pointing right.</p></div><span class="badge">~20 seconds</span></div>
<div class="coach"><strong>Ignore up/down for a moment.</strong> ↖ and ↙ count as LEFT. ↗ and ↘ count as RIGHT. This row already has two LEFT arrows and one RIGHT arrow. Which horizontal direction must the last cell have?</div>
<div class="rowStrip"><div class="stripCell">↖</div><div class="stripCell">↗</div><div class="stripCell">↙</div><div class="stripCell blank">?</div></div>
<div class="choices" style="grid-template-columns:repeat(2,1fr)"><button class="choice small" data-v="L">← LEFT</button><button class="choice small" data-v="R">RIGHT →</button></div>
<div id="fb" class="feedback"></div>${nextButton()}`;choiceButtons(null,'R','Exactly. The last cell <strong>must point right</strong>. You may not know ↗ versus ↘ yet—and that is okay. Harder puzzles let you record that as a pencil mark.','Count again: ↖ and ↙ are already the row’s two LEFT arrows, so the missing cell cannot also point left.');wireNext()}
function stage3(){root.innerHTML=`<div class="lessonHead"><div><h2>3. Balance a column</h2><p>Columns work the same way vertically: two arrows point up and two point down.</p></div><span class="badge">~20 seconds</span></div>
<div class="coach"><strong>Now ignore left/right.</strong> ↖ and ↗ count as UP. ↙ and ↘ count as DOWN. This column already has two UP arrows and one DOWN arrow. What must the last cell do?</div>
<div class="columnStrip"><div class="stripCell">↖</div><div class="stripCell">↘</div><div class="stripCell">↗</div><div class="stripCell blank">?</div></div>
<div class="choices" style="grid-template-columns:repeat(2,1fr)"><button class="choice small" data-v="U">↑ UP</button><button class="choice small" data-v="D">DOWN ↓</button></div>
<div id="fb" class="feedback"></div>${nextButton()}`;choiceButtons(null,'D','Correct. The last cell <strong>must point down</strong>. Again, that could mean ↙ or ↘ until another rule tells you left/right.','There are already two UP arrows (↖ and ↗), so the missing cell must be one of the DOWN arrows.');wireNext()}
function boardHTML(grid,target){let h='<div class="boardWrap"><div class="board" id="board">';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=grid[r][c];h+=`<div class="cell ${d?'given':''} ${target&&target[0]===r&&target[1]===c?'target':''}">${d?SYM[d]:''}</div>`}for(let r=1;r<4;r++)for(let c=1;c<4;c++)h+=`<i class="dot" style="left:${c*25}%;top:${r*25}%"></i>`;h+='</div><div class="rows" id="rows"></div><div class="cols" id="cols"></div></div>';return h}
function fillStats(grid){const rs=document.getElementById('rows'),cs=document.getElementById('cols');if(!rs)return;rs.innerHTML='';cs.innerHTML='';for(let r=0;r<4;r++){const v=grid[r].filter(Boolean),l=v.filter(LEFT).length;rs.innerHTML+=`<div class="stat"><b>${l}L · ${v.length-l}R</b>need 2/2</div>`}for(let c=0;c<4;c++){const v=grid.map(x=>x[c]).filter(Boolean),u=v.filter(UP).length;cs.innerHTML+=`<div class="stat"><b>${u}U · ${v.length-u}D</b>need 2/2</div>`}}
function stage4(){const g=S.map(r=>r.slice());g[0][1]='';root.innerHTML=`<div class="lessonHead"><div><h2>4. Combine two facts</h2><p>This is the key move in ARROW: a row can tell you left/right while a column tells you up/down.</p></div><span class="badge">~30 seconds</span></div>
<div class="coach"><strong>Look at the highlighted square.</strong> Row 1 already has two LEFT arrows (↖ and ↙), so the blank must point RIGHT. Column 2 already has two UP arrows (↖ and ↗), so the blank must point DOWN. <strong>RIGHT + DOWN = ?</strong></div>
${boardHTML(g,[0,1])}
<div class="choices"><button class="choice" data-v="NW">↖</button><button class="choice" data-v="NE">↗</button><button class="choice" data-v="SW">↙</button><button class="choice" data-v="SE">↘</button></div><div id="fb" class="feedback"></div>${nextButton('Try a real puzzle')}`;fillStats(g);choiceButtons(null,'SE','Yes: <strong>RIGHT + DOWN = ↘.</strong> This is the basic solving rhythm: rows give one half, columns give the other half, and dots can eliminate or force a corner.','Translate the two facts separately: RIGHT means ↗ or ↘. DOWN means ↙ or ↘. Only one arrow appears in both sets.');wireNext()}
function stage5(){const givens=S.map(r=>r.slice());[[0,1],[2,0],[2,1],[2,2],[3,1]].forEach(([r,c])=>givens[r][c]='');let grid=givens.map(r=>r.slice());let selected=null;root.innerHTML=`<div class="lessonHead"><div><h2>5. Graduation puzzle</h2><p>Five blanks. This is a real 4×4 puzzle, but every move is a direct deduction. The coach starts specific and then backs off.</p></div><span class="badge">~1–2 minutes</span></div>
<div class="coach" id="coach"><strong>Move 1:</strong> inspect the highlighted blank in Row 1. You can solve it from row + column balance exactly like Puzzle 4.</div>
<div class="boardWrap"><div class="board" id="board"></div><div class="rows" id="rows"></div><div class="cols" id="cols"></div></div>
<div class="choices"><button class="choice" data-v="NW">↖</button><button class="choice" data-v="NE">↗</button><button class="choice" data-v="SW">↙</button><button class="choice" data-v="SE">↘</button></div><div id="fb" class="feedback"></div><div class="rulebox"><strong>All three rules now apply:</strong> one arrow into every interior dot · 2 LEFT + 2 RIGHT in each row · 2 UP + 2 DOWN in each column.</div>`;
const order=[[0,1,'SE'],[2,2,'NE'],[2,1,'SW'],[2,0,'NW'],[3,1,'NE']];let step=0;
function dotInward(rr,cc){return rr===0?(cc===0?'SE':'SW'):(cc===0?'NE':'NW')}
function dotCount(r,c){let n=0,f=0;for(let rr=0;rr<2;rr++)for(let cc=0;cc<2;cc++){const d=grid[r+rr][c+cc];if(d){f++;if(d===dotInward(rr,cc))n++}}return{n,f}}
function draw(){const b=document.getElementById('board');b.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=grid[r][c],isBlank=!d,isTarget=step<order.length&&order[step][0]===r&&order[step][1]===c;const x=document.createElement('button');x.className='cell '+(givens[r][c]?'given ':'')+(d&&!givens[r][c]?'filled ':'')+(isTarget?'target':'');x.textContent=d?SYM[d]:'';x.onclick=()=>{if(isBlank&&!givens[r][c]){if(!isTarget){const f=document.getElementById('fb');f.className='feedback show bad';f.textContent='That square is not the next direct deduction in this walkthrough. Keep working on the highlighted square.';return}selected=[r,c]}};b.appendChild(x)}for(let r=1;r<4;r++)for(let c=1;c<4;c++){const d=document.createElement('i'),x=dotCount(r-1,c-1);d.className='dot'+(x.f===4&&x.n===1?' good':'');d.style.left=`${c*25}%`;d.style.top=`${r*25}%`;b.appendChild(d)}fillStats(grid)}
function coachText(){const c=document.getElementById('coach');if(step===0)c.innerHTML='<strong>Move 1:</strong> solve the highlighted Row 1 blank from row + column balance.';else if(step===1)c.innerHTML='<strong>Move 2:</strong> look at Column 3. It already has two DOWN arrows, so the highlighted cell points UP. Then use the nearby dot to choose ↖ versus ↗.';else if(step===2)c.innerHTML='<strong>Move 3:</strong> Row 3 now has its two RIGHT arrows. The highlighted cell must point LEFT. Column 2 tells you whether it is up or down.';else if(step===3)c.innerHTML='<strong>Your turn:</strong> two blanks remain. Use row + column balance. You should now be able to explain each move before placing it.';else if(step===4)c.innerHTML='<strong>Last one:</strong> one blank remains. Its row and column each tell you one half of the arrow.'}
document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(step>=order.length)return;const target=selected||[order[step][0],order[step][1]],want=order[step][2];if(target[0]!==order[step][0]||target[1]!==order[step][1]){feedback(false,'That square is not the intended next direct deduction. Look for the highlighted square first.');return}if(btn.dataset.v!==want){feedback(false,'Not quite. Re-check the row/column counts and, when needed, the nearby dot.');return}grid[target[0]][target[1]]=want;selected=null;step++;const f=document.getElementById('fb');f.className='feedback';f.innerHTML='';if(step===order.length){draw();document.getElementById('coach').innerHTML='<strong>You solved it.</strong> You used the same three rules as a normal Easy puzzle—no guessing required.';root.insertAdjacentHTML('beforeend',`<div class="feedback show good">You are ready for a normal Easy puzzle.</div><div class="finish"><h2>That’s the whole game.</h2><p>Scan rows for LEFT/RIGHT, columns for UP/DOWN, and dots for corner restrictions. Combine those facts until an exact diagonal arrow is forced.</p><a class="playLink" href="easy3.html">Play a normal Easy</a><a class="ghostLink" href="easy-calibration.html">Play the Easy set</a></div>`);return}draw();coachText()});draw()}
function render(){updateProgress();if(stage===0)stage1();else if(stage===1)stage2();else if(stage===2)stage3();else if(stage===3)stage4();else stage5()}
render();
})();
</script>
</body>
</html>
