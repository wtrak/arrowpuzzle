<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EQUARROW · Hard Puzzles</title><link rel="stylesheet" href="app.css"></head><body><header class="sitebar"><div class="sitebar-inner"><a class="brand" href="index.html"><span class="brandmark">↖↘</span><span><span class="equ">EQU</span>ARROW</span></a><nav class="nav"><a href="index.html">Home</a><a href="tutorial.html">Tutorial</a><a class="active" href="puzzles.html">Puzzles</a></nav></div></header><main class="page"><div class="breadcrumbs"><a href="index.html">Home</a><span>›</span><a href="puzzles.html">Puzzles</a><span>›</span><strong>Hard</strong></div><section class="hero"><div class="eyebrow">Deep challenge</div><h1 class="display" style="font-size:clamp(42px,9vw,70px)">Hard puzzles</h1><p class="lead">The original EQUARROW challenge. This is intentionally much tougher and is not recommended as a first puzzle.</p></section><div class="section-title"><h2>Choose a puzzle</h2><p>1 available</p></div><section class="puzzle-grid" id="grid"></section><div class="actions"><a class="btn" href="puzzles.html">← Difficulties</a><a class="btn" href="index.html">Home</a></div></main><script>const id='001';document.getElementById('grid').innerHTML=`<a class="puzzle-tile" data-puzzle="001" href="play.html?p=001"><span class="solved-badge">✓</span><div class="puzzle-num">001</div><div class="puzzle-meta">Original challenge<br><span class="best" data-best></span></div></a>`;const tile=document.querySelector('[data-puzzle]'),raw=localStorage.getItem('equarrow:'+id);if(raw){try{const x=JSON.parse(raw);if(x.solved){tile.classList.add('solved');const b=tile.querySelector('[data-best]');if(x.best)b.textContent='Best '+x.best;}}catch(e){}}</script></body></html>
